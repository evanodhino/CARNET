<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <div class="brand">
      <h1>Carnet</h1>
      <span class="tag">journal personnel</span>
    </div>

    <!-- AUTH VIEW -->
    <div id="authView" class="auth-card">
      <div class="tabs">
        <button type="button" id="tabLogin" class="active">Se connecter</button>
        <button type="button" id="tabSignup">S'inscrire</button>
      </div>

      <form id="loginForm">
        <h2>Content de vous revoir</h2>
        <div class="sub">Connectez-vous pour lire et écrire.</div>
        <label><span>Email</span><input id="loginMail" type="email" autocomplete="email" required></label>
        <label><span>Password</span><input id="loginPass" type="pseudo" autocomplete="pseudo" required></label>
        <div class="msg error" id="loginMsg"></div>
        <button class="primary" type="submit">Se connecter</button>
      </form>

      <form id="signupForm" hidden>
        <h2>Créer un compte</h2>
        <div class="sub">Votre journal, rien que pour vous.</div>
        <label><span>Email</span><input id="suMail" type="email" autocomplete="email" required></label>
        <label><span>Téléphone</span><input id="suPhone" type="tel" autocomplete="tel" placeholder="06 12 34 56 78"></label>
        <label><span>Password</span><input id="suPass" type="password" autocomplete="new-password" required minlength="6"></label>
        <div class="msg error" id="signupMsg"></div>
        <button class="primary" type="submit">S'inscrire</button>
      </form>

      <div class="hint" id="authHint">Connecté à Supabase — vos identifiants sont gérés et chiffrés par Supabase Auth, jamais stockés en clair.</div>
    </div>

    <!-- APP VIEW -->
    <div id="appView" hidden>
      <div class="app-bar">
        <div class="who">Connecté en tant que <b id="whoName"></b></div>
        <button class="ghost" id="logoutBtn">Se déconnecter</button>
      </div>

      <div class="composer">
        <input type="text" id="postTitle" placeholder="Titre de l'entrée" maxlength="80">
        <textarea id="postBody" placeholder="Écrivez quelque chose…"></textarea>
        <div class="divider"></div>
        <div class="row"><button class="primary" id="publishBtn">Enregistrer</button></div>
      </div>

      <div class="feed" id="feed"></div>
    </div>

  </div>

  <!-- SDK Supabase (UMD, épinglé à une version précise) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
